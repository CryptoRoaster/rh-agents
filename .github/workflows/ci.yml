name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Start native PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          sudo systemctl start postgresql
          sudo -u postgres createuser --login "$USER"
          sudo -u postgres createdb --owner="$USER" rh_agents_test
          database_url="postgresql+asyncpg://$USER@/rh_agents_test?host=/var/run/postgresql"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=$database_url" >> "$GITHUB_ENV"
      - name: Verify PostgreSQL migration
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic upgrade head --sql
      - name: PostgreSQL tests including concurrency
        run: uv run pytest
      - name: Lightweight SQLite tests
        run: env -u TEST_DATABASE_URL uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
