name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    # Sized from observed runs, not from a guess. Across the twenty most recent
    # backend jobs the whole job took 437s at its fastest and 864s at its
    # slowest — 14m24s, thirty-six seconds under a fifteen-minute budget — and
    # two jobs were cut off by that budget having reached 100% of the
    # PostgreSQL suite, with no test failure and no stall. The variance sits in
    # the suites themselves: the PostgreSQL step has been measured between 260s
    # and 788s on identical work, a factor of three that is the hosted runner's
    # and not this repository's.
    #
    # 25 minutes is 1.7x the slowest complete job ever observed and 1.4x the
    # sum of every step's own observed maximum, so the full suites, both lint
    # gates and mypy finish even on a runner as slow as the worst one seen. It
    # is deliberately not larger: this bound still exists to end a genuine
    # deadlock, and nothing here weakens a check or skips a step.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Start native PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          sudo systemctl start postgresql
          sudo -u postgres createuser --login "$USER"
          sudo -u postgres createdb --owner="$USER" rh_agents_test
          database_url="postgresql+asyncpg://$USER@/rh_agents_test?host=/var/run/postgresql"
          echo "DATABASE_URL=$database_url" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=$database_url" >> "$GITHUB_ENV"
      - name: Verify PostgreSQL migration
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic upgrade head --sql
      - name: PostgreSQL tests including concurrency
        run: uv run pytest
      - name: Lightweight SQLite tests
        run: env -u TEST_DATABASE_URL uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
